<title>大學眼科集團．線上手術評核系統</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700&family=Noto+Sans+TC:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#f3f8fb; --surface:#ffffff; --surface-alt:#e8f6fd; --surface-raised:#ffffff;
    --ink:#0d1e2e; --ink-soft:#4d6274; --ink-faint:#8ba0b0;
    --border:#d6e6f0; --border-soft:#e6f1f8;
    --accent:#009bde; --accent-deep:#002060; --accent-ink:#ffffff;
    --accent-soft:#dcf1fc; --accent-soft-border:#a9def5;
    --danger:#ac3b2c; --danger-soft:#f8e7e3;
    --lv1:#ac3b2c; --lv1-soft:#f8e7e3;
    --lv2:#c1512f; --lv2-soft:#f7e6e0;
    --lv3:#b3862c; --lv3-soft:#f6ecd8;
    --lv4:#2f7fa8; --lv4-soft:#e1eef5;
    --lv5:#009bde; --lv5-soft:#dcf1fc;
    --shadow:0 1px 2px rgba(0,32,96,.06), 0 8px 24px -12px rgba(0,32,96,.16);
    --shadow-sm:0 1px 2px rgba(0,32,96,.08);
    --radius:14px; --radius-sm:9px;
    color-scheme:light;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#071824; --surface:#0e2436; --surface-alt:#123049; --surface-raised:#0f2739;
      --ink:#eaf4fb; --ink-soft:#a9c2d2; --ink-faint:#6d8798;
      --border:#1c3c54; --border-soft:#16304a;
      --accent:#39b6f0; --accent-deep:#8fd4fb; --accent-ink:#052a3d;
      --accent-soft:rgba(57,182,240,.16); --accent-soft-border:rgba(57,182,240,.4);
      --danger:#e08770; --danger-soft:rgba(224,135,112,.14);
      --lv1:#e08770; --lv1-soft:rgba(224,135,112,.14);
      --lv2:#dd8767; --lv2-soft:rgba(221,135,103,.14);
      --lv3:#dcbb6c; --lv3-soft:rgba(220,187,108,.14);
      --lv4:#6fb3d9; --lv4-soft:rgba(111,179,217,.14);
      --lv5:#39b6f0; --lv5-soft:rgba(57,182,240,.16);
      --shadow:0 1px 2px rgba(0,0,0,.3), 0 12px 28px -14px rgba(0,0,0,.55);
      --shadow-sm:0 1px 2px rgba(0,0,0,.3);
      color-scheme:dark;
    }
  }
  :root[data-theme="dark"]{
    --bg:#071824; --surface:#0e2436; --surface-alt:#123049; --surface-raised:#0f2739;
    --ink:#eaf4fb; --ink-soft:#a9c2d2; --ink-faint:#6d8798;
    --border:#1c3c54; --border-soft:#16304a;
    --accent:#39b6f0; --accent-deep:#8fd4fb; --accent-ink:#052a3d;
    --accent-soft:rgba(57,182,240,.16); --accent-soft-border:rgba(57,182,240,.4);
    --danger:#e08770; --danger-soft:rgba(224,135,112,.14);
    --lv1:#e08770; --lv1-soft:rgba(224,135,112,.14);
    --lv2:#dd8767; --lv2-soft:rgba(221,135,103,.14);
    --lv3:#dcbb6c; --lv3-soft:rgba(220,187,108,.14);
    --lv4:#6fb3d9; --lv4-soft:rgba(111,179,217,.14);
    --lv5:#39b6f0; --lv5-soft:rgba(57,182,240,.16);
    color-scheme:dark;
  }

  *{box-sizing:border-box;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Noto Sans TC','IBM Plex Sans',-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px; line-height:1.6; -webkit-font-smoothing:antialiased;
  }
  .num{ font-family:'IBM Plex Mono','Noto Sans TC',monospace; font-variant-numeric:tabular-nums; }
  h1,h2,h3{ font-family:'Noto Serif TC','Noto Sans TC',serif; text-wrap:balance; margin:0; }
  a{ color:inherit; }
  button{ font-family:inherit; }
  ::selection{ background:var(--accent-soft); }

  .appbar{ position:sticky; top:0; z-index:40; background:var(--surface); background:color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter:blur(10px); border-bottom:1px solid var(--border-soft); }
  .appbar-inner{ max-width:960px; margin:0 auto; padding:14px 20px; display:flex; align-items:center; gap:16px; flex-wrap:wrap; }
  .brand{ display:flex; align-items:center; gap:10px; flex:1 1 auto; min-width:200px; }
  .brand-mark{ font-size:20px; }
  .brand h1{ font-size:17px; font-weight:700; color:var(--accent-deep); }
  .brand-sub{ font-size:11.5px; color:var(--ink-faint); font-weight:500; }
  .back-btn{ border:1px solid var(--border); background:var(--surface); color:var(--ink-soft); border-radius:999px; padding:7px 14px; font-size:12.5px; font-weight:700; cursor:pointer; white-space:nowrap; }
  .back-btn:hover{ background:var(--surface-alt); }
  .tabs{ display:flex; gap:4px; background:var(--surface-alt); border-radius:999px; padding:3px; }
  .tab-btn{ border:none; background:transparent; padding:7px 16px; border-radius:999px; font-size:13px; font-weight:600; color:var(--ink-soft); cursor:pointer; transition:background .15s ease, color .15s ease; }
  .tab-btn[aria-selected="true"]{ background:var(--surface); color:var(--accent); box-shadow:var(--shadow-sm); }
  .tab-btn:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; }

  main{ max-width:960px; margin:0 auto; padding:24px 20px 140px; }
  [hidden]{ display:none !important; }

  /* ---------- Home screen ---------- */
  .home-hero{ margin-bottom:26px; }
  .home-hero .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--accent); font-family:'IBM Plex Mono',monospace; }
  .home-hero h2{ font-size:22px; font-weight:700; margin:6px 0 8px; color:var(--accent-deep); }
  .home-hero p{ font-size:13.5px; color:var(--ink-soft); max-width:640px; margin:0; }
  .home-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:16px; margin-top:22px; }
  .home-card{ cursor:pointer; padding:20px; text-align:left; border:none; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); box-shadow:var(--shadow-sm); transition:box-shadow .15s ease, border-color .15s ease, transform .1s ease; }
  .home-card:hover{ border-color:var(--accent-soft-border); box-shadow:var(--shadow); }
  .home-card:active{ transform:scale(.99); }
  .home-card .hc-top{ display:flex; align-items:center; justify-content:space-between; }
  .home-card .hc-icon{ font-size:24px; }
  .home-card .hc-type{ font-size:10px; font-weight:700; padding:3px 9px; border-radius:999px; background:var(--surface-alt); color:var(--ink-faint); letter-spacing:.03em; }
  .home-card h3{ font-size:15px; font-weight:700; margin:12px 0 4px; color:var(--ink); }
  .home-card p{ font-size:12px; color:var(--ink-faint); margin:0; line-height:1.5; min-height:32px; }
  .home-card .hc-count{ font-size:11px; color:var(--accent); font-weight:700; margin-top:12px; font-family:'IBM Plex Mono',monospace; }

  /* ---------- Progress strip ---------- */
  .progress-strip{ display:flex; align-items:center; gap:18px; flex-wrap:wrap; background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); padding:16px 20px; margin-bottom:22px; box-shadow:var(--shadow-sm); }
  .ring-wrap{ position:relative; width:56px; height:56px; flex:none; }
  .ring-wrap svg{ transform:rotate(-90deg); width:56px; height:56px; }
  .ring-track{ fill:none; stroke:var(--border-soft); stroke-width:6; }
  .ring-fill{ fill:none; stroke:var(--accent); stroke-width:6; stroke-linecap:round; transition:stroke-dashoffset .3s ease; }
  .ring-label{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; font-family:'IBM Plex Mono',monospace; color:var(--ink); }
  .progress-meta{ display:flex; gap:26px; flex-wrap:wrap; flex:1; }
  .stat-label{ font-size:11px; color:var(--ink-faint); font-weight:600; letter-spacing:.04em; text-transform:uppercase; margin-bottom:2px; }
  .stat-value{ font-size:20px; font-weight:700; font-family:'IBM Plex Mono',monospace; }
  .stat-value small{ font-size:12px; color:var(--ink-faint); font-weight:500; }

  /* ---------- Cards / sections ---------- */
  .card{ background:var(--surface); border:1px solid var(--border-soft); border-radius:var(--radius); box-shadow:var(--shadow-sm); }
  .meta-card{ padding:20px; margin-bottom:28px; }
  .meta-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:14px 18px; }
  .field{ display:flex; flex-direction:column; gap:6px; }
  .field label{ font-size:12px; font-weight:600; color:var(--ink-soft); }
  .field .req{ color:var(--danger); }
  .field input,.field select,.field textarea{ font:inherit; font-size:14px; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border); background:var(--bg); color:var(--ink); transition:border-color .15s ease, box-shadow .15s ease; }
  .field input:focus,.field select:focus,.field textarea:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }

  .sign-card{ padding:20px; margin-bottom:24px; }
  .sign-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; }
  .sign-block-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:8px; }
  .sign-block-head label{ font-size:13px; font-weight:700; color:var(--ink); }
  /* 簽名欄固定使用淺色「紙面」，不隨深色／淺色模式變動：跟簽名固定深色墨水搭配，簽名區塊在任何模式下都維持清楚對比，也跟白底 PDF 輸出的外觀一致 */
  .sign-pad{ width:100%; height:140px; display:block; touch-action:none; cursor:crosshair; background:#fbfdfe; border:1.5px dashed #c7d2d9; border-radius:var(--radius-sm); }
  .sign-pad.signed{ border-style:solid; border-color:#a9def5; background:#ffffff; }
  .sign-hint{ font-size:11px; color:var(--ink-faint); margin-top:6px; }

  .section-head{ display:flex; align-items:baseline; gap:10px; margin:34px 0 14px; }
  .section-head .eyebrow{ font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); font-family:'IBM Plex Mono',monospace; }
  .section-head h2{ font-size:17px; font-weight:700; }
  .section-head .range{ margin-left:auto; font-size:12px; color:var(--ink-faint); font-family:'IBM Plex Mono',monospace; }
  .section-rule{ height:1px; background:var(--border-soft); margin:0 0 18px; }

  .item{ margin-bottom:14px; overflow:hidden; }
  .item-head{ display:flex; align-items:flex-start; gap:14px; padding:16px 18px; }
  .item-badge{ flex:none; width:34px; height:34px; border-radius:9px; background:var(--surface-alt); display:flex; align-items:center; justify-content:center; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:14px; color:var(--ink-soft); border:1px solid var(--border-soft); }
  .item.done .item-badge{ background:var(--accent-soft); color:var(--accent); border-color:var(--accent-soft-border); }
  .item-name{ flex:1; min-width:0; }
  .item-name .line{ font-weight:700; font-size:14.5px; color:var(--ink); }
  .item-name .line + .line{ font-weight:500; font-size:13px; color:var(--ink-soft); margin-top:2px; }
  .item-name .line.sub{ font-weight:400; font-size:12.5px; color:var(--ink-faint); margin-top:3px; }
  .item-cat-tag{ display:inline-block; font-size:10.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:999px; padding:2px 9px; margin-bottom:6px; }
  .score-pill{ flex:none; font-family:'IBM Plex Mono',monospace; font-weight:700; font-size:12.5px; padding:5px 11px; border-radius:999px; background:var(--surface-alt); color:var(--ink-faint); border:1px solid var(--border-soft); white-space:nowrap; }
  .item.done .score-pill{ background:var(--lv5-soft); color:var(--lv5); border-color:transparent; }
  .item.partial .score-pill{ background:var(--lv3-soft); color:var(--lv3); border-color:transparent; }

  .rubric{ display:grid; gap:1px; background:var(--border-soft); border-top:1px solid var(--border-soft); }
  .rubric.cols-4{ grid-template-columns:repeat(4,1fr); }
  .rubric.cols-5{ grid-template-columns:repeat(5,1fr); }
  .rubric-cell{ background:var(--surface); padding:12px 13px 14px; cursor:pointer; text-align:left; border:none; font:inherit; color:var(--ink); display:flex; flex-direction:column; gap:6px; min-height:100%; transition:background .12s ease; }
  .rubric-cell:hover{ background:var(--surface-alt); }
  .rubric-cell:focus-visible{ outline:2px solid var(--accent); outline-offset:-2px; }
  .rubric-head{ display:flex; align-items:center; gap:6px; font-size:11.5px; font-weight:700; }
  .lv-dot{ width:7px; height:7px; border-radius:50%; flex:none; }
  .rubric-cell[data-lv="1"] .lv-dot{ background:var(--lv1); } .rubric-cell[data-lv="2"] .lv-dot{ background:var(--lv2); } .rubric-cell[data-lv="3"] .lv-dot{ background:var(--lv3); }
  .rubric-cell[data-lv="4"] .lv-dot{ background:var(--lv4); } .rubric-cell[data-lv="5"] .lv-dot{ background:var(--lv5); }
  .rubric-cell[data-lv="1"] .rubric-head{ color:var(--lv1); } .rubric-cell[data-lv="2"] .rubric-head{ color:var(--lv2); } .rubric-cell[data-lv="3"] .rubric-head{ color:var(--lv3); }
  .rubric-cell[data-lv="4"] .rubric-head{ color:var(--lv4); } .rubric-cell[data-lv="5"] .rubric-head{ color:var(--lv5); }
  .rubric-cell p{ margin:0; font-size:12.5px; line-height:1.55; color:var(--ink-soft); }
  .rubric-cell p + p{ margin-top:5px; padding-top:5px; border-top:1px dashed var(--border-soft); }
  .rubric-cell.empty{ cursor:default; } .rubric-cell.empty:hover{ background:var(--surface); }
  .rubric-cell.empty p{ color:var(--ink-faint); font-style:italic; }
  .rubric-cell.selected[data-lv="1"]{ background:var(--lv1-soft); } .rubric-cell.selected[data-lv="2"]{ background:var(--lv2-soft); } .rubric-cell.selected[data-lv="3"]{ background:var(--lv3-soft); }
  .rubric-cell.selected[data-lv="4"]{ background:var(--lv4-soft); } .rubric-cell.selected[data-lv="5"]{ background:var(--lv5-soft); }
  .rubric-cell.selected p{ color:var(--ink); font-weight:500; }
  .rubric-cell.selected .rubric-head::after{ content:"已選"; margin-left:auto; font-weight:700; font-family:'Noto Sans TC',sans-serif; font-size:10.5px; }
  .weight-badge{ display:inline-block; margin-left:8px; font-size:10.5px; font-weight:700; padding:2px 8px; border-radius:999px; background:var(--surface-alt); color:var(--accent); font-family:'IBM Plex Mono',monospace; vertical-align:middle; }
  .item-badge.code{ width:auto; min-width:34px; padding:0 8px; font-size:11.5px; }

  .ref-card{ padding:18px 20px; margin-bottom:20px; }
  .ref-card h3{ font-size:13.5px; margin-bottom:10px; color:var(--accent-deep); }
  .ref-table{ width:100%; border-collapse:collapse; font-size:12px; }
  .ref-table th,.ref-table td{ text-align:left; padding:7px 10px; border-bottom:1px solid var(--border-soft); }
  .ref-table th{ color:var(--ink-faint); font-weight:700; font-size:10.5px; text-transform:uppercase; letter-spacing:.03em; }
  .ref-table td{ color:var(--ink-soft); }
  .ref-table tr:last-child td{ border-bottom:none; }

  .critical-card{ padding:18px 20px; margin-bottom:20px; border-color:var(--danger-soft); background:var(--danger-soft); }
  .critical-card h3{ font-size:13.5px; margin-bottom:4px; color:var(--danger); }
  .critical-card .hint{ font-size:11.5px; color:var(--ink-soft); margin-bottom:12px; }
  .critical-row{ display:flex; align-items:flex-start; gap:10px; padding:8px 0; border-top:1px dashed rgba(172,59,44,.25); }
  .critical-row:first-of-type{ border-top:none; }
  .critical-row input[type="checkbox"]{ margin-top:3px; width:16px; height:16px; accent-color:var(--danger); flex:none; }
  .critical-row label{ font-size:12.5px; color:var(--ink); line-height:1.5; }
  .critical-banner{ display:flex; align-items:center; gap:10px; background:var(--danger); color:#fff; border-radius:var(--radius-sm); padding:12px 16px; font-size:13px; font-weight:700; margin-bottom:20px; }

  .scale-row{ display:flex; flex-wrap:wrap; gap:8px; padding:2px 18px 16px; }
  .scale-btn{ border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:7px 15px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); transition:background .12s ease, color .12s ease, border-color .12s ease; }
  .scale-btn:hover{ background:var(--surface-alt); }
  .scale-btn.selected{ background:var(--accent-soft); border-color:var(--accent-soft-border); color:var(--accent); }
  .scale-row.compact{ padding:2px 18px 12px; gap:6px; }
  .scale-row.compact .scale-btn{ padding:5px 11px; font-size:11.5px; }
  .status-row{ display:flex; flex-wrap:wrap; gap:8px; padding:2px 18px 16px; }
  .status-btn{ border:1px solid var(--border); background:var(--surface); border-radius:999px; padding:7px 16px; font:inherit; font-size:12.5px; font-weight:700; cursor:pointer; color:var(--ink-soft); }
  .status-btn:hover{ background:var(--surface-alt); }
  .status-btn[data-v="done"].selected{ background:var(--lv5-soft); color:var(--lv5); border-color:transparent; }
  .status-btn[data-v="partial"].selected{ background:var(--lv3-soft); color:var(--lv3); border-color:transparent; }
  .status-btn[data-v="none"].selected{ background:var(--surface-alt); color:var(--ink-soft); border-color:transparent; }

  .item-notes{ padding:4px 18px 16px; }
  .item-notes textarea{ width:100%; min-height:44px; resize:vertical; font:inherit; font-size:13px; padding:9px 11px; border-radius:var(--radius-sm); border:1px solid var(--border-soft); background:var(--bg); color:var(--ink); }
  .item-notes input[type="text"]{ width:100%; font:inherit; font-size:12.5px; padding:8px 10px; border-radius:var(--radius-sm); border:1px solid var(--border-soft); background:var(--bg); color:var(--ink); }
  .item-notes textarea:focus,.item-notes input:focus{ outline:none; border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-soft); }
  .item-notes label{ display:block; font-size:11px; font-weight:600; color:var(--ink-faint); margin-bottom:5px; }
  .item-notes.compact{ padding:0 18px 14px; }

  .roster-panel{ padding:18px 20px; margin-bottom:24px; }
  .roster-panel h3{ font-size:13.5px; margin-bottom:10px; color:var(--accent-deep); }
  .roster-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:18px; }
  .roster-chips{ display:flex; flex-wrap:wrap; gap:6px; }
  .roster-chip{ font-size:11.5px; padding:4px 10px; border-radius:999px; background:var(--surface-alt); color:var(--ink-soft); border:1px solid var(--border-soft); }

  @media (max-width:640px){ .rubric.cols-4,.rubric.cols-5{ grid-template-columns:1fr 1fr; } }

  .actionbar{ position:fixed; left:0; right:0; bottom:0; z-index:40; background:var(--surface); background:color-mix(in srgb, var(--surface) 94%, transparent); backdrop-filter:blur(10px); border-top:1px solid var(--border-soft); }
  .actionbar-inner{ max-width:960px; margin:0 auto; padding:12px 20px; display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .actionbar .fill{ flex:1 1 auto; }
  .btn{ display:inline-flex; align-items:center; gap:8px; border-radius:999px; border:1px solid transparent; padding:10px 18px; font-size:13.5px; font-weight:700; cursor:pointer; white-space:nowrap; transition:transform .1s ease, background .15s ease, border-color .15s ease, opacity .15s ease; }
  .btn:active{ transform:scale(.97); }
  .btn:disabled{ opacity:.45; cursor:not-allowed; transform:none; }
  .btn-primary{ background:var(--accent); color:var(--accent-ink); }
  .btn-primary:hover:not(:disabled){ filter:brightness(.92); }
  .btn-ghost{ background:transparent; color:var(--ink-soft); border-color:var(--border); }
  .btn-ghost:hover:not(:disabled){ background:var(--surface-alt); }
  .btn-danger-ghost{ background:transparent; color:var(--danger); border-color:var(--danger-soft); }
  .btn-danger-ghost:hover:not(:disabled){ background:var(--danger-soft); }
  .btn-sm{ padding:7px 13px; font-size:12.5px; }

  .toast-stack{ position:fixed; right:20px; bottom:92px; z-index:60; display:flex; flex-direction:column; gap:8px; align-items:flex-end; }
  .toast{ background:var(--ink); color:var(--bg); padding:10px 16px; border-radius:10px; font-size:13px; box-shadow:var(--shadow); max-width:320px; animation:toast-in .18s ease; }
  .toast.error{ background:var(--danger); color:#fff; }
  @keyframes toast-in{ from{ opacity:0; transform:translateY(6px); } to{ opacity:1; transform:none; } }

  .modal-veil{ position:fixed; inset:0; background:rgba(10,16,14,.5); z-index:70; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal{ background:var(--surface); border-radius:var(--radius); padding:22px; max-width:380px; width:100%; box-shadow:var(--shadow); }
  .modal h3{ font-size:16px; margin-bottom:8px; }
  .modal p{ font-size:13.5px; color:var(--ink-soft); margin:0 0 18px; }
  .modal-actions{ display:flex; justify-content:flex-end; gap:10px; }

<script>

const EXAMS = [{"id":"cataract-basic","title":"白內障基礎評核表","subtitle":"Cataract Surgery Skills Assessment（基礎版）","icon":"&#128065;","type":"rubric","scale":{"2":"新手","3":"初學者","4":"進階者","5":"勝任者"},"levelOrder":[2,3,4,5],"maxPerItem":5,"sections":[{"title":"手術技巧評核","fromNo":1,"toNo":14},{"title":"眼球控制與整體表現","fromNo":15,"toNo":20}],"items":[{"no":1,"name":["鋪單："],"levels":{"2":["在沒有説明的情況下無法進行鋪單"],"3":["鋪單時需要少量的語言指導。睫毛覆蓋不完全。"],"4":["睫毛基本上被覆蓋，鋪單時對視野的妨礙極小。"],"5":["睫毛被完全覆蓋，切口部位明確，鋪單未妨礙視野。"]}},{"no":2,"name":["切口和穿刺：","成形和技巧"],"levels":{"2":["切口的結構、位置和大小不當。"],"3":["局部壓力致漏液和/或虹膜脫垂，導致到達晶狀體囊和囊袋的手術途徑和可視性不佳。"],"4":["切口選位較好或無漏液，但不是兩者兼有。"],"5":["切口平行於虹膜，可自行封閉，大小足夠，為手術操作提供了良好的路徑。"]}},{"no":3,"name":["OVD："],"levels":{"2":["恰當使用和安全置入不確定使用OVD的時機、種類和用量。","在穿刺過程中難以進入前房。"],"3":["需要少量指導。","知道使用時機，但是所選種類或用量有誤。"],"4":["不需指導。","在適當的時間給藥。給予了適當的劑量和類型。平針頭末端的位置適當。在提供多種OVD時不確定哪種是正確的選擇。"],"5":["將平針頭末端防止在囊袋和內皮的適當位置，並在適當的時機給予了正確劑量的OVD。","在提供多種OVD時能夠選用適當的種類。"]}},{"no":4,"name":["撕囊：","Flap製作","成形、位置與大小","支軸運用"],"levels":{"2":["需要指導，只求能夠挑起組織，會常發生破壞皮質。","大小和位置不適IOL類型和瞳孔位置，可發生撕裂。","不具備支軸觀念，前房撕開鑷拉扯主切口。"],"3":["少量指導，主要為破裂控制過程中的偶爾失控，可能破壞皮質。","大小和位置合適於瞳孔位置和IOL類型，但是撕的形狀不圓，或發生撕裂。","雖有支軸觀念，但執行程度差。"],"4":["在控制中，幾乎無不協調或復位操作，無破壞皮質。","大小和位置幾乎適用於瞳孔位置和IOL類型，具有可控性，無撕裂發生，僅需少量指導。","依照支軸觀念執行。"],"5":["靈巧地接近並自信地控制破裂，無破壞皮質。","大小和位置充分適用瞳孔位置和IOL類型，無撕裂，進行迅速，獨立的輻射控制，在整個撕囊過程中保持對皮瓣和前房深度的控制。","支軸技巧運作良好。"]}},{"no":5,"name":["水分離：","可見的流體波與隨意的核塊旋轉"],"levels":{"2":["水分離及水分層混淆。","水分離時液體的注射劑量不足或位置不當(過淺或過深)，無法使核塊旋轉。"],"3":["需要多次嘗試，能夠在一定程度上旋轉核塊，但是不完全。在充分的水分離之前嘗試在人工力量下旋轉。"],"4":["見液體注射入適當的位置，能夠旋轉核塊，但是無法使用針平順且保持水平轉動核塊。"],"5":["可見到理想的液體波，但是如果在最小阻力下實現了隨意的核塊旋轉且始終維持核塊在同一水平。","知道水分離的禁忌症。"]}},{"no":6,"name":["Phaco Tip和第二器械：","置入眼內"],"levels":{"2":["置入Phaco Tip或 第二器械時難度很大，前房塌陷，可損傷切口、囊袋或角膜內皮細胞。"],"3":["在一些失敗的嘗試之後置入了Phaco Tip或第二器械，可損傷切口、囊袋或角膜內皮細胞。"],"4":["在較大的難度下第一次即置入Phaco Tip和第二器械，未損傷切口、囊袋或角膜內皮細胞。"],"5":["將器械順利置入眼內，未損傷切口或角膜內皮細胞。"]}},{"no":7,"name":["有效使用和穩定性"],"levels":{"2":["經常看不到末端，很難將眼睛保持在初始位置，且在此過程中用力過度。"],"3":["經常看不到末端，經常需要處理以使眼睛保持在初始位置。"],"4":["在大多數時間保持末端的可見性，在輕壓或牽拉眼球的條件下可使眼睛基本保持在初始位置。"],"5":["一直保持末端的可見性，將眼睛保持在初始位置而不需壓住或牽拉眼球。"]}},{"no":8,"name":["Scuplt：","深度& Phaco"],"levels":{"2":["Scuplt :凹槽未在中心或深度不足，而且進入核塊上區，自中心部位取代核塊，從而根本無法分解核塊，眼睛持續運動。","Phaco :在乳化過程中經常使用錯誤的能量，並在不適當的時機給予能量，乳化頭運動過度導致/核塊的連續運動，從而無法粉碎核塊或凹槽的深度或寬度不夠，無法控制超音波動態特性。不能準確使用腳踏板。"],"3":["Scuplt :一些凹槽處於中心，一些進入核塊上區，在大多數凹槽內置換了核塊，在太淺的凹槽內嘗試使用器械分解核塊，眼睛經常運動。","Phaco :在乳化時能量的選擇中犯了中度錯誤，試驗性，乳化頭所致的核塊的經常性運動，難以粉碎核塊或在許多嘗試之後得到了適當的開槽，對超音波動態特性控制不佳而導致前房深度的波動。在腳踏板的操作方面有難度。"],"4":["Scuplt :大多數凹槽處於中心且深度足夠，很少進入核塊上區，很少取代核塊，數次嘗試在核塊中部分解且最後成功，眼睛通常位於初始位置。","Phaco :在乳化時使用了正確的能量，僅有極小的誤差，偶爾出現乳化頭所致的核塊的運動，在處理或固定核塊(粉碎時)方面有一定的困難或在獲得適當的開槽時需要少量重複嘗試，對超音波動態特性控制非常好，偶見前房深度的改變;用腳踏板極少出錯。"],"5":["Scuplt :凹槽處於中心，其深度足以保證分解的進行，長度未達到核塊上區，核塊未從中心位置被取代，器械放置的深度足以簡單且成功的分解核塊，眼睛保持在初始位置。","Phaco :熟練控制腳踏板，充分的超音波能量進行了乳化，向前運動時未改變眼睛的位置且未推動核塊，對核塊進行了安全處理(粉碎時)或凹槽的深度和寬度適當，根據前房的內部狀況控制超音波動態特性。。"]}},{"no":9,"name":["Divide："],"levels":{"2":["Chopper和Phaco Tip都放在刻好的溝槽表層；用力方向沒有平行像兩側，完全無法分開核塊。"],"3":["Chopper和Phaco Tip沒有完全頂在雕刻好的溝槽底，無法完全分開核塊(藕斷絲連)。"],"4":["雖可分開核塊，但已經破壞和塊完整，使手術視野不清楚。"],"5":["完整分離核塊，並保持手術區視野清晰。"]}},{"no":10,"name":["核塊：旋轉和操作"],"levels":{"2":["無法旋轉核塊 。"],"3":["能夠部分旋轉核塊，會牽拉懸韌帶。"],"4":["能夠充分旋轉核塊，但是會牽拉懸韌帶。"],"5":["安全有效地操作核塊，對懸韌帶和眼球的牽拉少。"]}},{"no":11,"name":["Phaco："],"levels":{"2":["Chop：總是危及或損傷毗鄰組織，無法完成任一部份的切割。","分段吸除：不具備支軸觀念，明顯的切口灼傷；捕捉前房周圍和進入囊袋的碎片有困難，對第二器械末端和保持Phaco Tip末端下方的第二器械的難度方面意識不夠。"],"3":["Chop：多數切割操作中危及或損傷毗鄰組織，能夠完成部份的切割。","分段吸除：雖有支軸觀念，但執行程度差，產生明顯的切口灼傷；捕捉了大多數前房周圍和進入囊袋的碎片，第二器械有時在Phaco Tip末端的下方。"],"4":["Chop：在一些切割操作危及或損傷毗鄰組織，可完成大多數片段的粉碎。","分段吸除：依照支軸觀念執行；捕捉了前房周圍和進入囊袋的一些碎片，第二器械通常在Phaco Tip末端的下方。"],"5":["Chop：在沒有不慎損傷毗鄰組織(尤其是囊袋)的情況處理核塊並採用垂直或水平的切割技術。所有核塊分割的厚度均在控制內，且為液體方式。","分段吸除：支軸操作佳無切口灼傷。碎片“漂”至Tip末端不需在前房周圍和囊袋內捕捉碎片。第二器械在Phaco Tip的下方，防surge時觸及後囊。"]}},{"no":12,"name":["去除皮質"],"levels":{"2":["在將I/A Tip置入囊袋撕裂邊緣下方有很大困難，不能控制抽吸孔的位置，不能按需調節抽吸的速率，不能充分剝除皮質物質，用IA Tip抽吸口損傷了囊袋或虹膜。","不具備支軸觀念，明顯拉扯切口。"],"3":["在將I/A Tip置入囊袋撕裂邊緣下方和保持開口向上的位置有中等困難，在無對合末端的情況下嘗試抽吸，對抽吸的動力學理解不佳，對皮質的剝除控制不理想，急動且緩慢損傷囊袋。多次嘗試導致殘留少量皮質物質。","雖有支軸觀念，但執行程差，產生多次拉扯切口。"],"4":["在將I/A Tip置入囊袋撕裂邊緣下方有極小的困難。抽吸口通常向上，對皮質進行了360度處理，皮質剝除緩慢，少許技術錯誤，殘留的皮質物質很少。","保持抽吸口向上，在灌洗模式下將抽吸頭置入囊袋撕裂邊緣下方。","依照支軸觀念執行；但小幅拉扯切口。"],"5":["在液體流恰好足以封閉末端的情況下開始抽吸，有效去除全部皮質。","向瞳孔的中心方向輕輕剝除皮質物質，以防拉扯懸韌帶。","支軸操作佳無拉扯切口。"]}},{"no":13,"name":["IOL植入"],"levels":{"2":["無法置入人工水晶體。","PMMA人工水晶體：不能置入人工水晶體，無法製作可置入硬片的切口；不能將haptic前腳放入囊袋中，不能將haptic後腳旋轉入位。","折疊型人工水晶體：不能將IOL裝載入卡匣(cartridge)或注射器(injector)內，不能控制IOL的注射，不能穩定控制injector tip置於主切口位置，IOL不在囊袋內或注射後上下顛倒。","IOL植入後無觀察顯微鏡的角膜反光及IOL後表面反光狀態。"],"3":["在人工水晶體的置入和操作方面存在困難，對眼睛操作粗糙，前房不穩定，重複嘗試導致人工水晶體邊緣的損傷。","PMMA人工水晶體：重複嘗試導致haptic前腳在囊袋內，haptic後腳轉入，拉扯致囊袋和懸韌帶撕裂。","折疊型人工水晶體：多次嘗試才在將IOL載入cartridge或injector內，注射IOL時猶豫不決，對IOL注射控制差，需要多次操作才將haptic放入囊袋中。","經提醒觀察IOL植入後顯微鏡反光狀態，但兩點反光無相疊。"],"4":["在極輕微的前房不穩定的狀況下完成人工水晶體的置入和操作，切口正好適用。","PMMA人工水晶體：在將haptic前腳置入囊袋內存在一定的困難，將前腳旋入時撕裂囊袋或牽扯懸韌帶。","折疊型人工水晶體：在將人工水晶體加載入cartridge或injector內有很小的困難，猶豫但是對IOL的注射控制良好，前後兩個haptic均在囊袋內。","IOL植入後觀察顯微鏡反光狀態，兩點反光經微調後相疊。"],"5":["在較深且穩定的前房和囊袋內進行人工水晶體的置入和操作，切口適用於IOL的類型。","PMMA人工水晶體：haptic前腳順利置入囊袋內；在不對囊袋撕裂部位和懸韌帶纖維造成過度牽拉的情況下將haptic後腳旋轉入位。","折疊型人工水晶體：能將人工水晶體載入cartridge或injector內，可控制IOL注射情況，IOL固定對稱，光學部和前後haptic均在囊袋內。","IOL植入後觀察顯微鏡反光，兩點反光相疊。"]}},{"no":14,"name":["切口關閉：","縫合&清除OVD &水化角膜(Hydration)"],"levels":{"2":["如需縫合，則需指導，且對縫線佈局不當，動作緩慢且存在很大困難，散光，彎針，縫合旋轉不完全，可導致傷口漏水，不能徹底清除OVD，不能使切口不漏水或沒有檢查切口的密封情況。","最終眼壓不佳。"],"3":["如需縫合，在縫線的佈局存在一些困難，可能需要再次縫合，切口關閉不可靠，從而可能導致散光，可能需要指導，不確定是否徹底清除了OVD，在手術結束時，需要額外操作方可確保切口不漏水。","眼壓不理想。"],"4":["如需縫合，縫線的佈局存在極小的困難，繃緊度足以保持切口關閉，可有輕度的散光，在該步驟之後可充分清除OVD，但是有一定困難。在手術結束時檢查了切口且不漏水，或僅需極小的調整。","眼壓可能不理想。"],"5":["如果需要縫合，縫線的繃緊度足以保持切口關閉，但是不會因為太緊而導致散光，在該步驟之後徹底清除了OVD，在手術結束時檢查了切口且不漏水。最終眼壓理想。"]}},{"no":15,"name":["切口不偏和儘量減少眼睛轉動與角膜變形"],"levels":{"2":["幾乎持續的 眼睛運動和角膜變形。"],"3":["眼睛經常不在初始位置，經常變形折疊。"],"4":["眼睛經常處於初始位置，發生輕度的角膜變形折疊。"],"5":["在手術過程中，眼睛保持在初始位置。未產生變形折疊。","切口的長度和位置防止了角膜變形。"]}},{"no":16,"name":["眼睛置於顯微鏡視野的中央"],"levels":{"2":["總是需要重新定位。"],"3":["偶爾需要重新定位。"],"4":["瞳孔位置輕微波動。"],"5":["在手術過程中，瞳孔保持在中心位置。"]}},{"no":17,"name":["結膜和角膜組織的處理"],"levels":{"2":["組織處理粗糙並導致損傷。"],"3":["組織處理處於邊界水準，發生極輕的損傷。"],"4":["組織處理得當，但是有存在損傷的可能性。"],"5":["處理過程中未損傷組織且無相關風險。"]}},{"no":18,"name":["眼內空間觀念"],"levels":{"2":["器械經常接觸囊袋、虹膜和內皮，不能將鈍性的第二手器械保持在適當的位置。"],"3":["偶爾意外接觸囊袋、虹膜和角膜內皮，經常將鈍性的第二手器械放置在囊袋和工作中的Phaco Tip末端之間。"],"4":["極少意外接觸囊袋、虹膜和角膜內皮。有時將鈍性的第二手器械放置在囊袋和工作中的Phaco Tip末端之間。"],"5":["無囊袋、虹膜和角膜內皮的意外接觸，當Phaco Tip於工作狀態時，鈍性的第二手器械一直在囊袋和Phaco Tip的末端之間。"]}},{"no":19,"name":["虹膜保護"],"levels":{"2":["虹膜時常處於風險中， 處理粗糙。"],"3":["虹膜偶爾處於風險中。使用鉤、環時虹膜保護需要幫助。"],"4":["虹膜保護良好。在虹膜鉤、環或其他虹膜保護方法方面存在輕度的困難。"],"5":["未損傷虹膜。使用所需的虹膜鉤、環或其他方法保護虹膜。"]}},{"no":20,"name":["整體速度和操作的流暢性"],"levels":{"2":["猶豫不決，經常做做停停，非常不流暢。"],"3":["偶爾做做停停，無效和不必要的操作較常見，手術持續約60 分鐘。"],"4":["偶見無效和/或不必要的操作，手術持續約45 分鐘。"],"5":[]}}],"evalueeLabel":"受評醫師（術者）","evaluatorLabel":"評核醫師（導師）","notionOption":"白內障-基礎"},{"id":"cataract-advanced","title":"白內障高階認知評核表","subtitle":"Cataract Advanced Knowledge Assessment","icon":"&#129504;","type":"knowledge","scaleLevels":[{"v":0,"label":"略知"},{"v":3,"label":"不太清楚"},{"v":4,"label":"清楚"},{"v":5,"label":"非常清楚"}],"maxPerItem":5,"items":[{"no":1,"cat":"理解AT IOL設計原理","name":["了解目前集團內所提供之AT IOL 品項"],"bullets":["•  散光矯正","•  多焦點","•  散光多焦點"]},{"no":2,"cat":"理解AT IOL設計原理","name":["明白多焦點晶體繞射與折射的設計："],"bullets":["•  折射原理提供遠視度數，繞射提供近視度數","•  繞射圈數與光學直徑，如何分光","•  所提供遠、中、距離焦點距離","•  三焦點人工水晶體的失焦曲線(Defocus curve)分佈","•  光學區大小及全片大小，夾角角度"]},{"no":3,"cat":"理解AT IOL設計原理","name":["明白分區折射多焦點晶體的設計："],"bullets":["•  光學區、漸進區及全片大小","•  如何分辨正反面、上下側"]},{"no":4,"cat":"理解AT IOL設計原理","name":["晶體與實際去除角膜散光度數的關係"],"bullets":[]},{"no":5,"cat":"患者篩選","name":["基礎評估"],"bullets":["•  患者的生活型態","•  患者的個性","•  患者的預期","•  眼睛健康狀態"]},{"no":6,"cat":"患者篩選","name":["進階評估"],"bullets":["•  患者不願意長時間戴眼鏡","•  年齡及之前的屈光紀錄","•  功能與職業需求","•  需注意患者的認同度","•  患者對視力的要求","•  患者對近距離活動的認知"]},{"no":7,"cat":"患者篩選","name":["患者人格特質評估"],"bullets":["•  過於挑剔的患者","•  存有不切實際預期的患者","•  想要戴眼鏡的患者"]},{"no":8,"cat":"掌握禁忌症","name":["先天性眼球異常："],"bullets":["小角膜、瞳孔異常、晶狀體半脫位，馬凡氏症候群…等"]},{"no":9,"cat":"掌握禁忌症","name":["後天性異常："],"bullets":["虹膜、瞳孔異常，角膜斑翳，反復性色素膜炎症"]},{"no":10,"ca 球放置，調整水平後才請助手抽吸。"],"4":["在控制中將紅點對準瞳孔中心；吸環放置接近水平，微調後進行抽吸。"],"5":["迅速將紅點對準瞳孔中心；吸環放置水平不需微調即可進行抽吸。"]}},{"no":5,"name":["置入PI壓平錐"],"levels":{"2":["未將壓平錐完全推入插槽中並上鎖；操作搖桿降下壓平錐，目標偏移吸環中心，過程中無注意吸環的水平；當壓平錐吸環接觸時，不太會判斷中心位置，需提醒才經多次調整位置使錐體中心定位，並轉搖桿往下至綠燈出現"],"3":["經提醒將壓平錐完全推入插槽中並上鎖；下壓平錐，目標略偏移吸環中心，過程中注意吸環的水平；當壓平錐吸環接觸時，雖會判斷中心位置，但需才調整多次位置才使錐體中心定位"],"4":["自行推入壓平錐於定點並上鎖；降下壓平錐於吸環中心，過程中保持吸環水平；壓平錐吸環接觸時，經微調即可使錐體中心定位，並至綠燈出現"],"5":["迅速將壓平錐推入及上鎖；當壓平錐吸環接觸時，即刻使錐體中心定位，並轉搖桿往下至綠燈出現"]}},{"no":6,"name":["製作角膜瓣"],"levels":{"2":["未注意Flap centration及Applanation area大於Flap，也沒留意螢幕上Meniscus大小是否變化；不會Applanation鬆扣調整。"],"3":["提醒後留意Flap centration及Applanation area與flap大小；提醒後留意螢幕上Meniscus大小是否變化，但不知如何應變；Applanation鬆扣調整位置時，動作粗暴而產生SCH。"],"4":["留意Flap centration及Applanation area與Flap大小；注意盯著螢幕上Meniscus大小是否變化，同時了解變大變小的應變；Applanation鬆扣調整位置時動作輕柔。"],"5":["能確定Flap centration、Applanation area大於Flap,雷射過程正確判斷螢幕上Meniscus大小；完成後移除Docking System平順。"]}},{"no":7,"name":["角膜標記"],"levels":{"2":["標記時角膜太乾或太濕而致記號不清楚或暈開；標記的位置沒跨越角膜瓣及邊緣，或有部分遮蔽瞳孔；僅做一個標記；標記時過於用力傷及角膜表皮。"],"3":["標記清楚無暈開；標記的位置無規律性(約11點鐘及1點鐘處)，雖跨越角膜瓣及邊緣，仍有部分遮蔽瞳孔；微微使角膜表面破皮。"],"4":["標記清楚但是兩個標記的位置方向及形式雷同不容易辨識正反面；角膜無破皮。"],"5":["標記清楚且位置與方向明確，兩個標記均跨越的位置角膜瓣及邊緣；標記後角膜清晰完整。"]}},{"no":8,"name":["沖洗角膜及結膜囊"],"levels":{"2":["沖洗力道過猛使水滴濺起，污染反射鏡或雷射點；有過多染劑殘留"],"3":["無水滴濺起，沖洗範圍沒有擴及整個角膜；部分皮脂和染劑殘留。"],"4":["沖洗範圍完整覆蓋全角膜；少許皮脂和染劑殘留。"],"5":["沖洗力道適中，沖洗後全角膜呈現清晰"]}},{"no":9,"name":["分離角膜瓣"],"levels":{"2":["未將穹隆內殘存灌洗液吸乾；多次無法建立flap edge的小縫隙。"],"3":["水分吸淨，可在hinge附近將flap edge勾出一個縫隙；近側及對側分離後未將Flap反摺成墨西哥餅狀"],"4":["迅速吸淨水分，並有效分離Flap且反摺妥當；不慎接觸stromal bed；出現少量出血不會處理。"],"5":["有效分離Flap且反摺妥當；Exposed stromal bed平滑、乾燥。"]}},{"no":10,"name":["眼球中心定位、跟踪和汽化"],"levels":{"2":["未調整聚焦在角膜基質層，中心定位沒有調整在瞳孔中心。"],"3":["進行汽化(擊發雷射)時，須提醒才記得運用三角棉棒保護角膜瓣；保護角膜瓣時三角棉棒不慎擋到雷射光束。"],"4":["對焦與定位迅速，且不需提醒會運用三角棉棒保護角膜瓣，但施力過大壓迫角膜瓣造成角膜瓣有壓痕或脫水。"],"5":["對焦與定位迅速，運用三角棉棒保護角膜瓣，施力適中無壓痕或脫水產生。"]}},{"no":11,"name":["角膜瓣復位"],"levels":{"2":["沒有適當以BSS濕潤基質；無法順利將折疊的Flap已撥成全開。"],"3":["重試後可將折疊的Flap撥成全開；平針頭進入Flap下方時損傷上皮。"],"4":["順利蓋回Flap，但平針頭沒有保持有水流出，偶爾出現傷及Flap的險境。"],"5":["有效濕潤基質，及撥開摺疊的角膜瓣；復位後對未迅速，沒有造成脫水或皺摺。"]}},{"no":12,"name":["清洗角膜瓣"],"levels":{"2":["水滴濺起污染鏡片或雷射點；針頭滑入角膜瓣下時損傷組織。"],"3":["針頭可平順進入角膜瓣下，沖洗基質有少量碎片、顆粒、RBC…等殘留；移動針頭時力道過大損傷Hinge；針頭多次進出於角膜瓣下。"],"4":["針頭平順進入角膜瓣下，沖洗基質時可完全清除碎片、顆粒、RBC…等；移動針頭時力道過大拉扯Hinge。"],"5":["順利進入角膜瓣並有效清除異物；力道適中無拉扯或損傷Hinge。"]}},{"no":13,"name":["角膜瓣對位及撫平"],"levels":{"2":["不規律的亂刷；沒有注意標記位置。"],"3":["由Hinge方向順勢將角膜瓣下多於灌洗液排出；平抹速度因不確定而過慢；棉棒位吸除多餘液體；沒有觀察Flap有無有效擴張。"],"4":["仔細觀察Flap擴張狀態；順利運用棉棒將異物清除；以棉棒仔細將角膜瓣及角膜邊緣標記對位妥當。"],"5":["有效運用棉棒倒影(Retroillumination)檢查gutter的對稱性。"]}},{"no":14,"name":["取下開眼器"],"levels":{"2":["未將開眼器放鬆，直接撥動患者眼瞼。"],"3":["經提醒放鬆開眼器；將上眼瞼往眉側拉上固定時手壓到眼球。"],"4":["不壓迫眼球將眉側眼瞼上拉固定，使開眼器放鬆下滑並將上緣滑出；下眼瞼為沒有固定好，連同開眼器下緣上滑使瓣移位。"],"5":["開眼器上下緣均順勢滑出，不影響角膜瓣位置。"]}},{"no":15,"name":["移除貼紙"],"levels":{"2":["沒有注意患者反應，造成患者疼痛；撕除時使水滴濺至鏡頭。"],"3":["經提醒才上拉/下拉眼皮，貼紙接觸角膜使之移位。"],"4":["主動上拉/下拉眼皮，貼紙沒有接觸角膜。"],"5":["上下眼皮貼紙移除順暢，未造成患者不適。"]}}],"evalueeLabel":"受評醫師（術者）","evaluatorLabel":"評核醫師（導師）","notionOption":"LASIK"},{"id":"wavelight","title":"Wavelight 儀器熟悉度評核表","subtitle":"Wavelight Platform Proficiency Checklist","icon":"&#128225;","type":"checklist","scaleLevels":[{"v":5,"label":"很熟悉"},{"v":4,"label":"熟悉"},{"v":3,"label":"普通"},{"v":2,"label":"略生疏"},{"v":1,"label":"生疏"},{"v":0,"label":"未學習"}],"maxPerItem":5,"categories":[{"code":"A","title":"Topolyzer / Vario"},{"code":"B","title":"Oculyzer II"},{"code":"C","title":"FS200"},{"code":"D","title":"EX500"}],"items":[{"no":1,"cat":"A","catTitle":"Topolyzer / Vario","name":["Tscherning技術原理"]},{"no":2,"cat":"A","catTitle":"Topolyzer / Vario","name":["主開關的位置及使用"]},{"no":3,"cat":"A","catTitle":"Topolyzer / Vario","name":["檢查桌的使用及其功能"]},{"no":4,"cat":"A","catTitle":"Topolyzer / Vario","name":["下頜托的使用"]},{"no":5,"cat":"A","catTitle":"Topolyzer / Vario","name":["儀器清理"]},{"no":6,"cat":"A","catTitle":"Topolyzer / Vario","name":["檢查桌、電腦和儀器的開關"]},{"no":7,"cat":"A","catTitle":"Topolyzer / Vario","name":["登入系統"]},{"no":8,"cat":"A","catTitle":"Topolyzer / Vario","name":["創建、錄入新病例"]},{"no":9,"cat":"A","cat /* ---------------- utilities ---------------- */
function $(sel){ return document.querySelector(sel); }
function todayISO(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function escapeHtml(s){ return String(s==null?"":s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function has(obj,k){ return Object.prototype.hasOwnProperty.call(obj, k); }
function toast(msg, isError){
  const el = document.createElement("div");
  el.className = "toast" + (isError ? " error" : "");
  el.textContent = msg;
  $("#toastStack").appendChild(el);
  setTimeout(()=>{ el.remove(); }, 3600);
}
function emptyMeta(){ return { evaluee:"", evaluator:"", date:todayISO(), site:"", period:"", eye:"", caseNo:"", email:"" }; }
function ensureExamState(id){
  if (!state.byExam[id]) state.byExam[id] = { meta: emptyMeta(), scores:{}, notes:{}, signatures:{ evaluee:null, evaluator:null }, criticalFlags:{} };
  if (!state.byExam[id].criticalFlags) state.byExam[id].criticalFlags = {};
  return state.byExam[id];
}
function currentSt(){ return ensureExamState(state.currentExam); }

function renderHome(){
  const typeLabel = {rubric:"技能量表", knowledge:"知識評核", checklist:"熟悉度評核", certification:"認證歷程", mixed:"認證歷程"};
  $("#homeGrid").innerHTML = EXAMS.map(ex => `

      <div class="hc-top"><span class="hc-icon">${ex.icon}</span><span class="hc-type">${typeLabel[ex.type]}</span></div>
      <h3>${ex.title}</h3>

      <div class="hc-count num">${ex.items.length} 項${ex.roster?"　&middot;　含認證名冊":""}</div>

  document.querySelectorAll("[data-open]").forEach(b => b.addEventListener("click", () => openExam(b.dataset.open)));

function openExam(id){
  state.currentExam = id;
  const exam = getExam(id);
  ensureExamState(id);
  $("#brandMark").innerHTML = exam.icon;
  $("#brandTitle").textContent = exam.title;
  $("#brandSub").textContent = exam.subtitle;
  $("#btnBack").hidden = false;
  $("#examTabs").hidden = false;
  $("#actionBar").hidden = false;
  $("#lblEvalueeSign").textContent = exam.evalueeLabel + "簽名";
  $("#lblEvaluatorSign").textContent = exam.evaluatorLabel + "簽名";
  switchTab("new");
  renderMetaGrid(exam);
  renderRoster(exam);
  renderItems();
  updateProgress();
  setupSignaturePads();
  restoreSignatures();
}

function goHome(){

  $("#viewHome").hidden = false;

  $("#viewHistory").hidden = true;
  $("#btnBack").hidden = true;

/* ---------------- meta grid ---------------- */
function renderMetaGrid(exam){
  const st = currentSt();
  const fields = metaFieldsFor(exam);
  const html = fields.map(key => {
    const def = META_FIELD_DEFS[key];
    let label = def.label;
    if (key === "evaluee") label = exam.evalueeLabel + ' <span class="req">*</span>';
    if (key === "evaluator") label = exam.evaluatorLabel + ' <span class="req">*</span>';
    const val = escapeHtml(st.meta[key] || (key === "date" ? todayISO() : ""));
    if (key === "eye"){
      return `<div class="field"><label>${label}</label>
        <select id="m_${key}" data-metafield="${key}">
          <option value="">未指定</option>
          <option value="OD（右眼）">OD（右眼）</option>
          <option value="OS（左眼）">OS（左眼）</option>
        </select></div>`;
    }
    const type = def.type === "eye" ? "text" : def.type;
    return `<div class="field"><label>${label}</label><input type="${type}" id="m_${key}" data-metafield="${key}" placeholder="${def.ph||""}" value="${val}"></div>`;
  }).join("");
  $("#metaGrid").innerHTML = html;
  fields.forEach(key => {
    const el = document.getElementById("m_"+key);
    if (key === "eye") el.value = st.meta[key] || "";
    el.addEventListener("input", () => { st.meta[key] = el.value; scheduleAutosave(); });
    el.addEventListener("change", () => { st.meta[key] = el.value; scheduleAutosave(); });
  });
  if (!st.meta.date) st.meta.date = todayISO();
}

  if (exam.criticalFails && exam.criticalFails.length){

    }

        <h3>&#9888;&#65039; Critical Fail｜重大安全指標</h3>
        <div class="hint">此為安全把關項目，非常規量表評分；勾選代表本次操作出現下列狀況，將於報告中特別註記，請據實勾選。</div>
        ${exam.criticalFails.map((c,i)=>`<div class="critical-row">
            <input type="checkbox" id="cf-${i}" data-cf="${i}" ${st.criticalFlags[i]?"checked":""}>
            <label for="cf-${i}">${escapeHtml(c)}</label>
          </div>`).join("")}
      </div>`;
  }

  if (exam.scoreGuide && exam.scoreGuide.length){
    html += `<div class="card ref-card">
        <h3>評分標準參考（單項行為錨點）</h3>
        <table class="ref-table"><thead><tr><th>分數</th><th>等級</th><th>臨床意義</th><th>對應授權建議</th></tr></thead><tbody>
          ${exam.scoreGuide.map(r=>`<tr><td class="num">${escapeHtml(r.score)}</td><td>${escapeHtml(r.grade)}</td><td>${escapeHtml(r.meaning)}</td><td>${escapeHtml(r.authorization)}</td></tr>`).join("")}
        </tbody></table>
      </div>`;
  }

  if (exam.gradingTable && exam.gradingTable.length){
    html += `<div class="card ref-card">
        <h3>綜合判定與臨床授權（依加權分 / Global 分對照，僅供參考，最終仍由資深醫師判定）</h3>
        <table class="ref-table"><thead><tr><th>加權分</th><th>Global 分</th><th>綜合等級</th><th>主刀授權</th><th>監督要求</th></tr></thead><tbody>
          ${exam.gradingTable.map(r=>`<tr><td class="num">${escapeHtml(r.weightedRange)}</td><td class="num">${escapeHtml(r.globalRange)}</td><td>${escapeHtml(r.grade)}</td><td>${escapeHtml(r.authorization)}</td><td>${escapeHtml(r.supervision)}</td></tr>`).join("")}
        </tbody></table>
      </div>`;
  }

  mount.innerHTML = html;

  mount.querySelectorAll("[data-cf]").forEach(cb => {
    cb.addEventListener("change", () => {
      const s = currentSt();
      s.criticalFlags[cb.dataset.cf] = cb.checked;
      scheduleAutosave();

/* ---------------- rendering: dispatch ---------------- */
function renderItems(){
  const exam = getExam(state.currentExam);

function sectionHead(title, range){
  return `<div class="section-head"><span class="eyebrow">Section</span><h2>${title}</h2><span class="range num">${range}</span></div><div class="section-rule"></div>`;
}

/* ----- rubric item card (shared by rubric-type exams and "mixed" exams) ----- */
function rubricItemCardHtml(exam, it, st){
  const levelOrder = exam.levelOrder;
  const sel = st.scores[it.no];
  const names = it.name.map(n=>`<div class="line">${escapeHtml(n)}</div>`).join("");
  const cells = levelOrder.map(lv => {
    const texts = it.levels[String(lv)] || [];
    const empty = texts.length === 0;
    const body = empty ? `<p>（原表未提供此等級描述）</p>` : texts.map(t=>`<p>${escapeHtml(t)}</p>`).join("");
    const isSel = sel === lv;
    return `<button type="button" class="rubric-cell${empty?" empty":""}${isSel?" selected":""}" data-item="${it.no}" data-lv="${lv}" ${empty?"disabled":""}>
        <span class="rubric-head"><span class="lv-dot"></span>${exam.scale[lv]}&middot;${lv}分</span>${body}</button>`;
  }).join("");
  const note = st.notes[it.no] || "";
  const badgeText = it.code ? escapeHtml(it.code) : String(it.no).padStart(2,"0");
  const badgeCls = it.code ? "item-badge code" : "item-badge num";
  const weightBadge = (it.weight && it.weight !== 1) ? `<span class="weight-badge">&times;${it.weight}</span>` : "";
  return `<div class="card item${sel?" done":""}" id="item-${it.no}">
      <div class="item-head">
        <div class="${badgeCls}">${badgeText}</div>
        <div class="item-name">${names}${weightBadge}</div>
        <div class="score-pill">${sel!=null ? (exam.scale[sel]+"&middot;"+sel+"分") : "未評分"}</div>
      </div>
      <div class="rubric cols-${levelOrder.length}">${cells}</div>
      <div class="item-notes"><label for="note-${it.no}">備註 / 說明</label>
        <textarea id="note-${it.no}" data-note="${it.no}" placeholder="可記錄特殊狀況、指導重點&hellip;">${escapeHtml(note)}</textarea></div>
    </div>`;
}

/* ---------------- progress / stats ---------------- */
function computeStats(exam, st){
  const total = exam.items.length;
  if (exam.type === "certification"){
    let done=0, partial=0, none=0;
    exam.items.forEach(it => {
      const v = st.scores[it.no];
      if (v === "done") done++; else if (v === "partial") partial++; else none++;
    });
    return { total, done, partial, none, isCert:true };
  }
  let doneCount = 0, sum = 0, weightDone = 0;
  let totalWeight = 0;
  exam.items.forEach(it => {
    const w = it.weight || 1;
    totalWeight += w;
    if (has(st.scores, it.no)){ doneCount++; sum += st.scores[it.no]*w; weightDone += w; }
  });
  const maxTotal = totalWeight * exam.maxPerItem;
  return { total, done: doneCount, sum, maxTotal, avg: doneCount>0 ? sum/weightDone : null, isCert:false };
}

function computeGroupStats(exam, st, group){
  let doneCount = 0, sum = 0, weightDone = 0, total = 0, totalWeight = 0;
  exam.items.forEach(it => {
    if (it.no < group.fromNo || it.no > group.toNo) return;
    const w = it.weight || 1;
    total++; totalWeight += w;
    if (has(st.scores, it.no)){ doneCount++; sum += st.scores[it.no]*w; weightDone += w; }
  });
  return { total, done: doneCount, avg: doneCount>0 ? sum/weightDone : null, sum };
}

function updateProgress(){
  const exam = getExam(state.currentExam);
  const st = currentSt();
  const s = computeStats(exam, st);
  const pct = s.total ? Math.round(((s.isCert ? (s.done+s.partial) : s.done)/s.total)*100) : 0;
  const meta = $("#progressMeta");
  if (s.isCert){
    meta.innerHTML = `
      <div><div class="stat-label">評核進度</div><div class="stat-value num">${s.done+s.partial} <small>/ ${s.total} 項</small></div></div>
      <div><div class="stat-label">已完成</div><div class="stat-value num">${s.done} <small>項</small></div></div>
      <div><div class="stat-label">進行中</div><div class="stat-value num">${s.partial} <small>項</small></div></div>`;
  } else {
    let extra = "";
    if (exam.statsGroups){
      extra = exam.statsGroups.map(g => {
        const gs = computeGroupStats(exam, st, g);
        return `<div><div class="stat-label">${escapeHtml(g.label)}</div><div class="stat-value num">${gs.avg!=null?gs.avg.toFixed(2):"&mdash;"} <small>/ ${exam.maxPerItem}.0（${gs.done}/${gs.total}）</small></div></div>`;
      }).join("");
    }
    const overall = exam.hideOverallScore ? "" : `
      <div><div class="stat-label">總分</div><div class="stat-value num">${s.done>0?Math.round(s.sum*100)/100:"&mdash;"} <small>/ ${s.maxTotal}</small></div></div>
      <div><div class="stat-label">平均分</div><div class="stat-value num">${s.avg!=null?s.avg.toFixed(2):"&mdash;"} <small>/ ${exam.maxPerItem}.0</small></div></div>`;
    meta.innerHTML = `
      <div><div class="stat-label">評核進度</div><div class="stat-value num">${s.done} <small>/ ${s.total} 項</small></div></div>
      ${overall}
      ${extra}`;
  }
  const r = 24, C = 2*Math.PI*r;
  const ring = $("#ringFill");
  ring.setAttribute("stroke-dasharray", C.toFixed(1));
  ring.setAttribute("stroke-dashoffset", (C * (1-pct/100)).toFixed(1));
  $("#ringLabel").textContent = pct + "%";
}

let autosaveTimer = null;
function scheduleAutosave(){ clearTimeout(autosaveTimer); autosaveTimer = setTimeout(saveDraft, 500); }

/* ---------------- signature pads ---------------- */
function setupSignaturePad(key, canvasId){
  const canvas = document.getElementById(canvasId);
  const ctx = canvas.getContext("2d");
  const ratio = window.devicePixelRatio || 1;
  const cssW = canvas.clientWidth || 380, cssH = canvas.clientHeight || 140;
  canvas.width = cssW * ratio;
  canvas.height = cssH * ratio;
  ctx.scale(ratio, ratio);
  ctx.lineWidth = 2.6;
  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  // 簽名固定用深色墨水，不跟隨畫面深色／淺色模式切換：
  // PDF 報告一律是白底輸出，若簽名顏色跟著深色模式變成淺色，畫在白底上會幾乎看不見。
  ctx.strokeStyle = "#0d1e2e";

  let drawing = false, dirty = false, last = null;
  function pos(e){ const r = canvas.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  function start(e){ drawing = true; last = pos(e); canvas.setPointerCapture(e.pointerId); }
  function move(e){
    if (!drawing) return;
    const p = pos(e);
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke();
    last = p; dirty = true;
    canvas.classList.add("signed");
  }
  function end(){
    if (!drawing) return;
    drawing = false;
    if (dirty){ currentSt().signatures[key] = canvas.toDataURL("image/png"); scheduleAutosave(); }
  }
  canvas.addEventListener("pointerdown", start);
  canvas.addEventListener("pointermove", move);
  canvas.addEventListener("pointerup", end);
  canvas.addEventListener("pointerleave", end);

  signaturePads[key] = {
    canvas, ctx,
    clear(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.classList.remove("signed");
      dirty = false;
      currentSt().signatures[key] = null;
      scheduleAutosave();
    },
    restore(dataUrl){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      canvas.classList.remove("signed");
      if (!dataUrl) return;
      const img = new Image();
      img.onload = () => {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        ctx.drawImage(img, 0, 0, cssW, cssH);
        canvas.classList.add("signed");
      };
      img.src = dataUrl;
    }
  };
}
let padsInitialized = false;
function setupSignaturePads(){
  if (padsInitialized) return;
  padsInitialized = true;
  setupSignaturePad("evaluee", "padEvaluee");
  setupSignaturePad("evaluator", "padEvaluator");
  document.querySelectorAll("[data-clear-sign]").forEach(btn => {
    btn.addEventListener("click", () => {
      const key = btn.dataset.clearSign;
      if (signaturePads[key]) signaturePads[key].clear();
    });
  });
}
function restoreSignatures(){
  const st = currentSt();
  if (signaturePads.evaluee) signaturePads.evaluee.restore(st.signatures.evaluee);
  if (signaturePads.evaluator) signaturePads.evaluator.restore(st.signatures.evaluator);
}

    const catKey = it.cat+"|"+it.catTitle;
    if (catKey !== lastCat){ out += `<div class="rp-section">${escapeHtml(it.cat+"："+it.catTitle)}</div>`; lastCat = catKey; }
    const sel = has(st.scores, it.no) ? st.scores[it.no] : null;
    const selLabel = exam.scaleLevels.find(l=>l.v===sel);
    const note = st.notes[it.no] ? `<div class="nt">說明：${escapeHtml(st.notes[it.no])}</div>` : "";
    out += `<div class="rp-item"><b class="no">${String(it.no).padStart(2,"0")}</b>
        <div><div class="nm">${escapeHtml(it.name.join(" / "))}</div>${note}</div>
        <div class="sc">${selLabel?selLabel.label:"&ndash;"}</div></div>`;
  });
  return out;
}
function reportRowsCertification(exam, st){
  let lastCat = null, out = "";
  exam.items.forEach(it => {
    if (it.cat !== lastCat){ out += `<div class="rp-section">${escapeHtml(it.cat)}</div>`; lastCat = it.cat; }
    const sel = has(st.scores, it.no) ? st.scores[it.no] : null;
    const selLabel = exam.statusLevels.find(l=>l.v===sel);
    const note = st.notes[it.no] ? `<div class="nt">${escapeHtml(st.notes[it.no])}</div>` : "";
    out += `<div class="rp-item"><b class="no">${String(it.no).padStart(2,"0")}</b>
        <div><div class="nm">${escapeHtml(it.name.join(" / "))}</div><div class="lv">${escapeHtml((it.detail||[]).join("；"))}</div>${note}</div>
        <div class="sc">${selLabel?selLabel.label:"未評估"}</div></div>`;
  });
  if (exam.roster && (exam.roster.cert.length||exam.roster.factory.length)){
    out += `<div class="rp-roster"><b>集團內部認證：</b>${escapeHtml(exam.roster.cert.join("、")||"—")}<br><b>原廠認證：</b>${escapeHtml(exam.roster.factory.join("、")||"—")}</div>`;
  }
  return out;
}

function buildReportHtml(){
  const exam = getExam(state.currentExam);
  const st = currentSt();
  const s = computeStats(exam, st);
  const m = st.meta;
  const genTime = new Date().toLocaleString("zh-TW", {hour12:false});
  let rows;
  if (exam.type === "rubric") rows = reportRowsRubric(exam, st);
  else if (exam.type === "knowledge") rows = reportRowsKnowledge(exam, st);
  else if (exam.type === "checklist") rows = reportRowsChecklist(exam, st);
  else if (exam.type === "mixed") rows = reportRowsMixed(exam, st);
  else rows = reportRowsCertification(exam, st);

  const totalLine = s.isCert
    ? `<span>已完成 ${s.done} / ${s.total} 項（進行中 ${s.partial} 項）</span>`
    : (exam.hideOverallScore
        ? `<span>已完成 ${s.done} / ${s.total} 項</span>`
        : `<span>已完成 ${s.done} / ${s.total} 項</span><span>加權平均分 <b>${s.avg!=null?s.avg.toFixed(2):"&mdash;"}</b> / ${exam.maxPerItem}.0</span>`);

  let groupLine = "";
  if (exam.statsGroups){
    groupLine = `<div class="rp-total" style="border-top:none; padding-top:0; margin-top:6px;">` +
      exam.statsGroups.map(g => {
        const gs = computeGroupStats(exam, st, g);
        return `<span>${escapeHtml(g.label)}：<b>${gs.avg!=null?gs.avg.toFixed(2):"&mdash;"}</b> / ${exam.maxPerItem}.0</span>`;
      }).join("") + `</div>`;
  }

  let criticalBlock = "";
  if (exam.criticalFails && exam.criticalFails.length){
    const checked = exam.criticalFails.filter((_,i)=> !!st.criticalFlags[i]);
    if (checked.length){
      criticalBlock = `<div class="rp-critical"><b>&#9888;&#65039; 已勾選重大安全指標（Critical Fail）：</b>${checked.map(c=>escapeHtml(c)).join("；")}</div>`;
    }
  }

  return `<div class="rp-page">
      <h1 class="rp-title">${escapeHtml(exam.title)}</h1>
      <p class="rp-sub">${exam.subtitle} &middot; 產生時間 ${genTime}</p>
      <div class="rp-meta">
        <div><span>${escapeHtml(exam.evalueeLabel)}</span><b>${escapeHtml(m.evaluee)||"&mdash;"}</b></div>
        <div><span>${escapeHtml(exam.evaluatorLabel)}</span><b>${escapeHtml(m.evaluator)||"&mdash;"}</b></div>
        <div><span>評核日期</span><b>${escapeHtml(m.date)||"&mdash;"}</b></div>
        <div><span>受訓 / 服務地點</span><b>${escapeHtml(m.site)||"&mdash;"}</b></div>
        <div><span>受訓 / 學習期間</span><b>${escapeHtml(m.period)||"&mdash;"}</b></div>
        <div><span>手術眼別 / 案例編號</span><b>${escapeHtml(m.eye)||"&mdash;"} ${escapeHtml(m.caseNo||"")}</b></div>
      </div>
      ${rows}
      ${criticalBlock}
      <div class="rp-total">${totalLine}</div>
      ${groupLine}
      <div class="rp-sign">
        ${signBlock(st.signatures.evaluee, m.evaluee, exam.evalueeLabel+"簽名")}
        ${signBlock(st.signatures.evaluator, m.evaluator, exam.evaluatorLabel+"簽名")}
      </div>
      <div class="rp-foot">此紀錄由「${escapeHtml(exam.title)}．線上評核系統」產生，內容依評核醫師現場評分為準。大學眼科集團．ICO-OSCAR 標準格式。</div>
    </div>`;
}

// 每頁上／下留白（pt），避免內容緊貼紙張邊緣（列印時容易被裁切）
const PDF_MARGIN_TOP_PT = 28;
const PDF_MARGIN_BOTTOM_PT = 32;
// 換頁時不可從中間切開的區塊（每個評核項目、區段標題、基本資料、重大安全指標、總分、簽名等）
const PDF_NO_SPLIT_SELECTOR = ".rp-item, .rp-section, .rp-meta, .rp-critical, .rp-total, .rp-sign, .rp-roster";

async function generatePdfBlob(){
  const root = document.getElementById("reportRoot");
  root.innerHTML = buildReportHtml();
  await new Promise(r=>setTimeout(r, 60));

  const page = root.querySelector(".rp-page");
  const pageRect = page.getBoundingClientRect();
  const kids = Array.from(page.children);
  // 收集「不可切開」區塊在內容中的上下邊界（DOM px，相對於 .rp-page 頂部）；
  // 區段標題（rp-section）會跟著它後面第一個項目一起視為同一個不可切開的整體，避免標題被留在頁尾孤立。
  const noSplitBlocks = [];
  kids.forEach((el, i) => {
    if (!el.matches(PDF_NO_SPLIT_SELECTOR)) return;
    const r = el.getBoundingClientRect();
    let top = r.top - pageRect.top, bottom = r.bottom - pageRect.top;
    if (el.matches(".rp-section") && kids[i+1]){
      const nr = kids[i+1].getBoundingClientRect();
      bottom = Math.max(bottom, nr.bottom - pageRect.top);
    }
    noSplitBlocks.push({ top, bottom });
  });

  const canvas = await html2canvas(root, {scale:2, backgroundColor:"#ffffff", useCORS:true, windowWidth:794});
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF("p","pt","a4");
  const pageWidth = pdf.internal.pageSize.getWidth();
  const pageHeight = pdf.internal.pageSize.getHeight();
  const imgWidth = pageWidth;
  const pxPerPt = canvas.width / imgWidth;                 // canvas 像素 / PDF pt
  const domPxToCanvasPx = canvas.height / root.getBoundingClientRect().height; // DOM px 轉 canvas 像素
  const imgHeightPt = canvas.height / pxPerPt;             // 整份內容換算成 PDF pt 的總高度
  const usableHeightPt = pageHeight - PDF_MARGIN_TOP_PT - PDF_MARGIN_BOTTOM_PT;

  const blocksPt = noSplitBlocks.map(b => ({
    top: (b.top * domPxToCanvasPx) / pxPerPt,
    bottom: (b.bottom * domPxToCanvasPx) / pxPerPt
  }));

  function findSafeCutPt(targetPt, floorPt){
    let cut = targetPt;
    for (const b of blocksPt){
      if (cut > b.top + 0.5 && cut < b.bottom - 0.5) cut = b.top;
    }
    // 若退回後幾乎沒有內容可放（單一區塊本身就比一頁還高等極端狀況），放棄避讓、直接切在原位置
    if (cut <= floorPt + 20) cut = targetPt;
    return cut;
  }

  const sliceCanvas = document.createElement("canvas");
  const sctx = sliceCanvas.getContext("2d");

  let contentTopPt = 0;
  let firstPage = true;
  while (contentTopPt < imgHeightPt - 0.5){
    const targetPt = Math.min(contentTopPt + usableHeightPt, imgHeightPt);
    const cutPt = (imgHeightPt - targetPt < 0.5) ? imgHeightPt : findSafeCutPt(targetPt, contentTopPt);
    const slicePt = Math.max(cutPt - contentTopPt, 1);

    const srcYpx = Math.round(contentTopPt * pxPerPt);
    const srcHpx = Math.max(1, Math.min(Math.round(slicePt * pxPerPt), canvas.height - srcYpx));

    sliceCanvas.width = canvas.width;
    sliceCanvas.height = srcHpx;
    sctx.fillStyle = "#ffffff";
    sctx.fillRect(0, 0, sliceCanvas.width, sliceCanvas.height);
    sctx.drawImage(canvas, 0, srcYpx, canvas.width, srcHpx, 0, 0, canvas.width, srcHpx);
    // 用高品質 JPEG（而非 PNG）壓縮每一頁：內容是白底文字，肉眼幾乎看不出差異，
    // 但檔案大小可以從幾十 MB 降到幾 MB，PDF 才實際上傳得動 Google Drive、Email 也附得動。
    const sliceData = sliceCanvas.toDataURL("image/jpeg", 0.92);

    if (!firstPage) pdf.addPage();
    firstPage = false;
    pdf.addImage(sliceData, "JPEG", 0, PDF_MARGIN_TOP_PT, imgWidth, slicePt);

    contentTopPt = cutPt;
  }

  return pdf.output("blob");
}

function blobToBase64(blob){
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onloadend = () => {
      const result = reader.result || "";
      const idx = result.indexOf(",");
      resolve(idx >= 0 ? result.slice(idx + 1) : result);
    };
    reader.onerror = () => reject(reader.error || new Error("讀取 PDF 內容失敗"));
    reader.readAsDataURL(blob);
  });
}

function downloadBlobLocally(blob, filename){
  try{
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 4000);
    return true;
  }catch(e){
    console.error(e);
    return false;
  }
}

async function uploadPdfToDrive(blob, filename){
  if (!DRIVE_UPLOAD_URL) return { ok:false, error:"尚未設定 Google Drive 上傳網址" };
  console.info(`[Drive 上傳] 檔名：${filename}，PDF 大小：${(blob.size/1024/1024).toFixed(2)} MB`);

  const UPLOAD_TIMEOUT_MS = 45000;
  const controller = new AbortController();

  async function doUpload(){
    const pdfBase64 = await blobToBase64(blob);
    const resp = await fetch(DRIVE_UPLOAD_URL, {
      method: "POST",
      headers: { "Content-Type": "text/plain;charset=utf-8" }, // 避免觸發 CORS 預檢請求，Apps Script 無法處理 OPTIONS
      body: JSON.stringify({ filename, pdfBase64 }),
      signal: controller.signal
    });
    // 用 text() 而非 json()：即使伺服器端（或 Google 基礎設施）在真正執行 Apps Script 前
    // 就先擋下請求、回傳非 JSON 的錯誤頁面，也能得到清楚訊息，而不是被 json() 直接拋出難以理解的例外。
    const text = await resp.text();
    try{
      return JSON.parse(text);
    }catch(parseErr){
      const snippet = (text || "").slice(0, 120).replace(/\s+/g," ").trim();
      throw new Error(`伺服器回應非預期格式（HTTP ${resp.status}）：${snippet || "（空白回應）"}`);
    }
  }

  // 用 Promise.race 包住「整個」上傳流程（而非只有 fetch 本身）：
  // 就算卡在讀取回應內容（resp.text()）這一步，也保證最多 45 秒後這個函式一定會回傳，
  // 「完成評核並產生 PDF」按鈕就不會再永遠反灰卡死。
  let timeoutId;
  const timeoutPromise = new Promise((_, reject) => {
    timeoutId = setTimeout(() => { controller.abort(); reject(new Error("TIMEOUT")); }, UPLOAD_TIMEOUT_MS);
  });

  try{
    const result = await Promise.race([doUpload(), timeoutPromise]);
    return result;
  }catch(err){
    console.error("[Drive 上傳失敗]", err);
    const timedOut = err && err.message === "TIMEOUT";
    return { ok:false, error: timedOut ? "上傳逾時（45 秒），請確認網路狀況或改用本機下載" : String((err && err.message) || err) };
  }finally{
    clearTimeout(timeoutId);
  }
}

function pdfFilename(){
  const exam = getExam(state.currentExam);
  const st = currentSt();
  const safe = (st.meta.evaluee || exam.evalueeLabel).replace(/[\\/:*?"<>|]/g,"").trim() || exam.evalueeLabel;
  const d = st.meta.date || todayISO();
  return `${exam.title}_${safe}_${d}.pdf`;
}

async function handleFinish(){
  const exam = getExam(state.currentExam);
  const st = currentSt();
  const missing = validateForFinish(exam, st);
  if (missing.length){ toast("請先填寫：" + missing.join("、"), true); return; }
  const s = computeStats(exam, st);
  const missingSigns = [];
  if (!st.signatures.evaluee) missingSigns.push(exam.evalueeLabel+"簽名");
  if (!st.signatures.evaluator) missingSigns.push(exam.evaluatorLabel+"簽名");
  const assessed = s.isCert ? (s.done+s.partial) : s.done;
  if (assessed < s.total || missingSigns.length){
    const lines = [];
    if (assessed < s.total) lines.push(`已完成 ${assessed} / ${s.total} 項評分`);
    if (missingSigns.length) lines.push(`尚未簽名：${missingSigns.join("、")}`);
    const ok = await confirmModal("紀錄尚未完整", lines.join("；") + "。仍要產生 PDF 紀錄嗎？未完成項目將於報告中留白，供日後補齊。", "仍要產生");
    if (!ok) return;
  }

  const btn = $("#btnFinish");
  btn.disabled = true;
  btn.textContent = "產生中…";
  try{
    const blob = await generatePdfBlob();
    lastPdfBlob = blob;
    const filename = pdfFilename();

    // 先同步 Google Drive，最後才觸發本機下載：
    // 使用者（尤其平板）看到「PDF 已下載」通常就代表任務結束、會立刻放下裝置或切到下一位受評醫師，
    // 這個瞬間之後背景任務很容易被系統中斷。把順序反過來，等雲端同步這一步先塵埃落定，
    // 才進行使用者眼中「大功告成」的本機下載動作，同步就不會再被使用者的正常操作打斷。
    if (DRIVE_UPLOAD_URL){
      btn.textContent = "同步至 Google Drive…";
      showSyncOverlay();
      try{
        const driveResult = await uploadPdfToDrive(blob, filename);
        if (driveResult && driveResult.ok){
          toast("已同步上傳至 Google Drive。");
        } else {
          const errMsg = (driveResult && driveResult.error) ? driveResult.error : "原因不明，請查看瀏覽器主控台（Console）";
          toast(`Google Drive 同步失敗：${errMsg}（PDF 已保留在本機）`, true);
        }
      } finally {
        hideSyncOverlay();
      }
      btn.textContent = "產生中…";
    }

    if (downloadsApi){
      try{
        await downloadsApi.save({ filename, data: blob });
        toast("PDF 已產生，請於下載中確認檔案。");
      }catch(err){
        if (err && err.code === "declined") toast("已取消下載。");
        else if (downloadBlobLocally(blob, filename)) toast("PDF 已下載至本機。");
        else fallbackPrint();
      }
    } else if (downloadBlobLocally(blob, filename)){
      toast("PDF 已下載至本機。");
    } else {
      fallbackPrint();
    }

    await saveRecord(s, filename);
  } catch(e){
    console.error(e);
    toast("PDF 產生失敗，請重試一次。", true);
  } finally {
    hideSyncOverlay();
    btn.disabled = false;
    btn.textContent = "完成評核並產生 PDF";
  }
}

function fallbackPrint(){
  toast("此環境暫不支援直接下載，已為您開啟列印預覽，請選擇「另存為 PDF」。");
  const root = document.getElementById("reportRoot");
  root.style.left = "0"; root.style.position = "static";
  document.body.classList.add("printing");
  const style = document.createElement("style");
  style.id = "printOnlyStyle";
  style.textContent = "@media print{ body > *:not(#reportRoot){display:none !important;} #reportRoot{position:static !important; left:0 !important;} }";
  document.head.appendChild(style);
  setTimeout(()=>{
    window.print();
    root.style.left = "-99999px"; root.style.position = "fixed";
    document.body.classList.remove("printing");
    style.remove();
  }, 80);
}

function openMailDraft(){
  if (!lastPdfBlob){ toast("請先產生 PDF 紀錄，再開啟寄送 Email。", true); return; }
  const exam = getExam(state.currentExam);
  const st = currentSt();
  const s = computeStats(exam, st);
  const to = encodeURIComponent(st.meta.email || "");
  const subject = encodeURIComponent(`${exam.title}－${st.meta.evaluee||exam.evalueeLabel}－${st.meta.date||todayISO()}`);
  const summary = s.isCert
    ? `完成度：${s.done+s.partial} / ${s.total} 項（已完成 ${s.done}，進行中 ${s.partial}）`
    : `完成度：${s.done} / ${s.total} 項，總分 ${s.done>0?s.sum:"—"} / ${s.maxTotal}`;
  const body = encodeURIComponent(
    `${exam.evalueeLabel}：${st.meta.evaluee||""}\n`+
    `${exam.evaluatorLabel}：${st.meta.evaluator||""}\n`+
    `評核日期：${st.meta.date||""}\n`+
    `受訓 / 服務地點：${st.meta.site||""}\n`+
    `${summary}\n\n`+
    `（請記得附加剛才下載的 PDF 評核紀錄檔案後再送出）`
  );
  window.location.href = `mailto:${to}?subject=${subject}&body=${body}`;
}

function notionProperties(exam, d){
  const m = d.meta || {};
  const s = d.stats || {};
  return {
    "Name": `${exam.title} - ${m.evaluee||"未命名"} - ${m.date||""}`,
    "受評醫師": m.evaluee || "",
    "評核醫師（導師）": m.evaluator || "",
    "手術日期": m.date || null,
    "受訓地點": m.site || "",
    "手術眼別": m.eye || "",
    "案例編號": m.caseNo || "",
    "評核項目": exam.notionOption,
    "完成項目數": s.assessed || 0,
    "總分": s.sum || 0,
    "平均分": s.avg || 0,
    "完整度": (s.assessed >= s.total) ? "已完成" : "部分完成",
    "評核摘要": s.summaryText || ""
  };
}
function notionContent(exam, d){
  const scores = d.scores || {}, notes = d.notes || {};
  const lines = [`**${escapeHtml(exam.title)}**　${d.stats && d.stats.summaryText || ""}`, ""];
  exam.items.forEach(it => {
    const v = has(scores, it.no) ? scores[it.no] : null;
    let vText = "尚未評分";
    if (exam.type === "rubric") vText = v!=null ? `${exam.scale[v]}．${v}分` : vText;
    else if (exam.type === "knowledge" || exam.type === "checklist"){
      const lv = (exam.scaleLevels||[]).find(l=>l.v===v);
      vText = lv ? `${lv.label}．${lv.v}分` : vText;
    } else if (exam.type === "certification"){
      const lv = (exam.statusLevels||[]).find(l=>l.v===v);
      vText = lv ? lv.label : "未評估";
    } else if (exam.type === "mixed"){
      if (it.itemType === "rubric") vText = v!=null ? `${exam.scale[v]}．${v}分` : vText;
      else { const lv = (exam.scaleLevels||[]).find(l=>l.v===v); vText = lv ? `${lv.label}．${lv.v}分` : vText; }
    }
    lines.push(`**${String(it.no).padStart(2,"0")}　${it.name.join(" / ")}** — ${vText}`);
    if (notes[it.no]) lines.push(`備註：${notes[it.no]}`);
    lines.push("");
  });
  if (exam.criticalFails && exam.criticalFails.length){
    const flags = d.criticalFlags || {};
    const checked = exam.criticalFails.filter((_,i)=> !!flags[i]);
    lines.push("---");
    lines.push("**⚠️ 重大安全指標（Critical Fail）**");
    lines.push(checked.length ? checked.map(c=>`- ${c}`).join("\n") : "（本次評核未勾選任何重大安全指標）");
    lines.push("");
  }
  return lines.join("\n");
}

async function syncRecordToNotion(recordId, d, btn){
  if (!mcpApi){ toast("尚未啟用 Notion 連線，請於 claude.ai 設定中連接 Notion 後再試。", true); return; }
  const exam = getExam(d.examId) || EXAMS[0];
  if (btn){ btn.disabled = true; btn.textContent = "同步中…"; }
  try{
    const res = await mcpApi.callTool("Notion", "notion-create-pages", {
      parent: { data_source_id: NOTION_DATA_SOURCE_ID },
      pages: [{ properties: notionProperties(exam, d), content: notionContent(exam, d) }]
    });
    const page = res && res.payload && res.payload.pages && res.payload.pages[0];
    if (page && page.url && dbApi){
      await dbApi.collection("evaluations").doc(recordId).update({ notionUrl: page.url });
    }
    toast("已同步至 Notion 紀錄庫。");
    renderHistory();
  }catch(err){
    console.error(err);
    const code = err && err.code;
    if (code === "server_not_connected" || code === "not_in_manifest") toast("尚未連接 Notion，請於 claude.ai 設定的「連接器」中新增 Notion。", true);
    else if (code === "needs_reauth") toast("Notion 連線已逾期，請重新連接後再試一次。", true);
    else if (code === "selection_required") toast("請先在跳出的提示中選擇要使用的 Notion 帳號，再試一次。", true);
    else if (code === "not_granted" || code === "capability_disabled") toast("此檢視未啟用 Notion 同步功能。", true);
    else toast("同步至 Notion 失敗：" + (err && err.message ? err.message : "請稍後再試"), true);
    if (btn){ btn.disabled = false; btn.textContent = "同步至 Notion"; }
  }
}

function statsForSave(exam, st){
  const s = computeStats(exam, st);
  let criticalCount = 0, criticalText = "";
  if (exam.criticalFails && exam.criticalFails.length){
    criticalCount = exam.criticalFails.filter((_,i)=> !!st.criticalFlags[i]).length;
    if (criticalCount > 0) criticalText = `；⚠️ 已勾選重大安全指標 ${criticalCount} 項`;
  }
  if (s.isCert){
    return { total: s.total, assessed: s.done+s.partial, done: s.done, partial: s.partial, sum:0, avg:0,
      summaryText: `已完成 ${s.done} / ${s.total} 項，進行中 ${s.partial} 項` };
  }
  if (exam.type === "mixed" && exam.statsGroups && exam.statsGroups.length){
    const groups = exam.statsGroups.map(g => Object.assign({label: g.label}, computeGroupStats(exam, st, g)));
    const parts = [`完成 ${s.done} / ${s.total} 項`].concat(groups.map(g =>
      `${g.label} ${g.avg!=null?(Math.round(g.avg*100)/100):"—"} / ${exam.maxPerItem}.0（${g.done}/${g.total}）`));
    const opGroup = groups[groups.length-1];
    const base = { total: s.total, assessed: s.done,
      sum: opGroup.done>0 ? Math.round(opGroup.sum*100)/100 : 0,
      avg: opGroup.avg!=null ? Math.round(opGroup.avg*100)/100 : 0,
      summaryText: parts.join("；") + criticalText };
    if (exam.criticalFails && exam.criticalFails.length) base.criticalCount = criticalCount;
    return base;
  }
  const base = { total: s.total, assessed: s.done, sum: s.done>0?s.sum:0, avg: s.avg? Math.round(s.avg*100)/100 : 0,
    summaryText: `完成 ${s.done} / ${s.total} 項，加權總分 ${s.done>0?Math.round(s.sum*100)/100:"—"} / ${s.maxTotal}${criticalText}` };
  if (exam.criticalFails && exam.criticalFails.length) base.criticalCount = criticalCount;
  return base;
}

async function saveRecord(statsRaw, filename){
  if (!dbApi) return;
  const exam = getExam(state.currentExam);
  const st = currentSt();
  try{
    const stats = statsForSave(exam, st);
    await dbApi.collection("evaluations").add({
      examId: exam.id,
      examTitle: exam.title,
      meta: st.meta,
      scores: st.scores,
      notes: st.notes,
      signatures: st.signatures,
      criticalFlags: st.criticalFlags || {},
      stats,
      filename,
      createdAt: new Date().toISOString()
    });

  }catch(e){
    console.error(e);
    toast("PDF 已下載，但雲端歷史紀錄儲存失敗（可能是簽名檔過大）。", true);

async function renderHistory(){
  const mount = $("#historyMount");
  if (!dbApi){
    mount.innerHTML = `<div class="history-empty"><div class="glyph">&#128193;</div>此檢視尚未啟用歷史紀錄同步功能，<br>仍可正常產生並下載 PDF 評核紀錄。</div>`;
    return;
  }
  const exam = getExam(state.currentExam);
  mount.innerHTML = `<div class="history-empty">載入中&hellip;</div>`;
  try{
    const snap = await dbApi.collection("evaluations").orderBy("createdAt","desc").limit(200).get();
    const docs = snap.docs.filter(doc => (doc.data().examId || "cataract-basic") === exam.id);
    if (!docs.length){
      mount.innerHTML = `<div class="history-empty"><div class="glyph">&#128203;</div>尚無「${escapeHtml(exam.title)}」的歷史評核紀錄。<br>完成評核後會自動出現在這裡。</div>`;
      return;
    }
    const rows = docs.map(doc => {
      const d = doc.data();
      const dt = d.createdAt ? new Date(d.createdAt).toLocaleString("zh-TW",{hour12:false}) : "";
      const stats = d.stats || {};
      const notionAction = !mcpApi ? "" : d.notionUrl
        ? `<a class="btn btn-ghost btn-sm" href="${d.notionUrl}" target="_blank" rel="noopener">在 Notion 開啟</a>`
        : `<button class="btn btn-ghost btn-sm" data-notion-sync="${doc.id}">同步至 Notion</button>`;
      return `<div class="card rec">
          <div class="rec-main">
            <div class="rec-title">${escapeHtml((d.meta&&d.meta.evaluee)||"未命名")} <span style="color:var(--ink-faint); font-weight:500;">by ${escapeHtml((d.meta&&d.meta.evaluator)||"—")}</span></div>
            <div class="rec-sub">${dt} &middot; ${(d.meta&&d.meta.site)||"—"} &middot; ${escapeHtml(stats.summaryText||"")}</div>
          </div>
          <div class="rec-actions">
            ${notionAction}
            <button class="btn btn-ghost btn-sm" data-redownload="${doc.id}">重新下載</button>
            <button class="btn btn-danger-ghost btn-sm" data-delete="${doc.id}">刪除</button>
          </div>
        </div>`;
    }).join("");
    const notionBulk = !mcpApi ? "" : `<div style="display:flex; justify-content:flex-end; margin-bottom:12px;"><button class="btn btn-ghost btn-sm" id="btnNotionSyncAll">全部同步至 Notion</button></div>`;
    mount.innerHTML = notionBulk + rows;

    mount.querySelectorAll("[data-redownload]").forEach(b => b.addEventListener("click", () => redownload(b.dataset.redownload)));
    mount.querySelectorAll("[data-delete]").forEach(b => b.addEventListener("click", () => deleteRecord(b.dataset.delete)));
    mount.querySelectorAll("[data-notion-sync]").forEach(b => b.addEventListener("click", async () => {
      const id = b.dataset.notionSync;
      const snapDoc = await dbApi.collection("evaluations").doc(id).get();
      if (snapDoc.exists) await syncRecordToNotion(id, snapDoc.data(), b);
    }));
    const bulkBtn = $("#btnNotionSyncAll");
    if (bulkBtn) bulkBtn.addEventListener("click", async () => {
      bulkBtn.disabled = true; bulkBtn.textContent = "同步中…";
      for (const doc of docs){
        const d = doc.data();
        if (!d.notionUrl) await syncRecordToNotion(doc.id, d);
      }
      bulkBtn.disabled = false; bulkBtn.textContent = "全部同步至 Notion";
    });
  }catch(e){
    console.error(e);
    mount.innerHTML = `<div class="history-empty">歷史紀錄載入失敗，請稍後再試。</div>`;
  }
}

async function redownload(id){
  if (!dbApi) return;
  try{
    const snap = await dbApi.collection("evaluations").doc(id).get();
    if (!snap.exists){ toast("找不到此筆紀錄。", true); return; }
    const d = snap.data();
    const exam = getExam(d.examId) || getExam(state.currentExam);
    const prevExam = state.currentExam;
    const prevState = JSON.parse(JSON.stringify(state.byExam[prevExam] || emptyMeta()));
    state.currentExam = exam.id;
    const st = ensureExamState(exam.id);
    Object.assign(st.meta, d.meta||{});
    st.scores = d.scores || {};
    st.notes = d.notes || {};
    st.signatures = d.signatures || { evaluee:null, evaluator:null };
    st.criticalFlags = d.criticalFlags || {};
    const blob = await generatePdfBlob();
    const filename = d.filename || pdfFilename();
    if (downloadsApi){
      await downloadsApi.save({ filename, data: blob });
      toast("已重新產生並下載 PDF。");
    } else {
      lastPdfBlob = blob;
      fallbackPrint();
    }
    state.byExam[prevExam] = prevState;
    state.currentExam = prevExam;
  }catch(err){
    console.error(err);
    toast("重新下載失敗，請再試一次。", true);
  }
}

async function deleteRecord(id){
  const ok = await confirmModal("刪除這筆紀錄？", "刪除後將無法復原，僅會移除歷史紀錄，不影響已下載的 PDF 檔案。", "刪除", true);
  if (!ok) return;
  try{
    await dbApi.collection("evaluations").doc(id).delete();

    toast("已刪除。");
  }catch(e){
    toast("刪除失敗，請再試一次。", true);
  }
}

/* ---------------- sync overlay ---------------- */
// 產生 PDF 之後，同步上傳 Google Drive 是在背景默默進行的，過去只靠按鈕文字變化提示，
// 很容易被使用者忽略——PDF 一下載完，人就切到下一位受評醫師或關掉分頁了，
// 導致上傳其實還沒完成就被中斷，畫面上也不會留下任何「失敗」的痕跡。
// 改用一個會擋住整個畫面、且離開頁面時會跳出瀏覽器原生警告的遮罩，明確請使用者稍候。
let _syncBeforeUnloadHandler = null;
let _syncWakeLock = null;

// 平板／手機瀏覽器背景執行限制比筆電嚴格很多：只要螢幕自動鎖定或切到其他 App，
// 背景分頁的 JS（含還在進行中的網路請求）幾乎會立刻被系統暫停，
// 「離開頁面前跳出警告」在這種情境下幾乎沒有防護力（螢幕自動鎖定並不算「離開頁面」，不會觸發 beforeunload）。
// 所以額外用 Screen Wake Lock API 在同步期間盡量讓螢幕保持喚醒，減少「同步到一半螢幕自動鎖定」的機率；
// 不支援此 API 的瀏覽器則靜默略過，不影響其他功能。
async function acquireSyncWakeLock(){
  try{
    if ("wakeLock" in navigator){
      _syncWakeLock = await navigator.wakeLock.request("screen");
    }
  }catch(e){
    console.warn("Screen Wake Lock 取得失敗（可忽略，不影響同步本身）：", e);
  }
}

function releaseSyncWakeLock(){
  if (_syncWakeLock){
    try{ _syncWakeLock.release(); }catch(e){}
    _syncWakeLock = null;
  }
}

function showSyncOverlay(){
  hideSyncOverlay();
  const veil = document.createElement("div");
  veil.className = "sync-veil";
  veil.id = "syncVeil";
  veil.innerHTML = `<div class="sync-card">
      <div class="sync-spinner"></div>
      <h3>正在儲存評核紀錄…</h3>
      <p>正在同步至 Google Drive，請勿關閉、切換頁面或讓平板螢幕鎖定，最多約需 45 秒，完成後才會顯示下載完成訊息。</p>
    </div>`;
  document.body.appendChild(veil);
  _syncBeforeUnloadHandler = (e) => {
    e.preventDefault();
    e.returnValue = "";
    return "";
  };
  window.addEventListener("beforeunload", _syncBeforeUnloadHandler);
  acquireSyncWakeLock();
}

function hideSyncOverlay(){
  const veil = document.getElementById("syncVeil");
  if (veil) veil.remove();
  if (_syncBeforeUnloadHandler){
    window.removeEventListener("beforeunload", _syncBeforeUnloadHandler);
    _syncBeforeUnloadHandler = null;
  }
  releaseSyncWakeLock();
}

/* ---------------- modal ---------------- */
function confirmModal(title, desc, okLabel, danger){
  return new Promise(resolve => {
    const veil = document.createElement("div");
    veil.className = "modal-veil";
    veil.innerHTML = `<div class="modal">
        <h3>${escapeHtml(title)}</h3>
        <p>${escapeHtml(desc)}</p>
        <div class="modal-actions">
          <button class="btn btn-ghost btn-sm" id="mCancel">取消</button>
          <button class="btn ${danger?"btn-danger-ghost":"btn-primary"} btn-sm" id="mOk">${escapeHtml(okLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(veil);
    veil.querySelector("#mCancel").addEventListener("click", ()=>{ veil.remove(); resolve(false); });
    veil.querySelector("#mOk").addEventListener("click", ()=>{ veil.remove(); resolve(true); });
    veil.addEventListener("click",(e)=>{ if(e.target===veil){ veil.remove(); resolve(false);} });
  });
}

   並非真正的資安機制（檢視原始碼即可看到密碼），不可取代伺服器 / 內網層級的存取控管。 */

  $("#pwGate").classList.add("hidden");
  $("#appRoot").hidden = false;
  try { sessionStorage.setItem(PW_SESSION_KEY, "1"); } catch(e){}
  initApp();
}

function initPasswordGate(){
  let alreadyUnlocked = false;
  try { alreadyUnlocked = sessionStorage.getItem(PW_SESSION_KEY) === "1"; } catch(e){}
  if (alreadyUnlocked){ unlockApp(); return; }

  const form = $("#pwForm");
  const input = $("#pwInput");
  const err = $("#pwErr");
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (input.value === APP_PASSWORD){
      unlockApp();
    } else {
      err.textContent = "密碼錯誤，請再試一次。";
      input.value = "";
      input.focus();
    }
  });
  input.focus();
}
